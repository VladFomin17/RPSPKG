<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Компьютерная графика — лабораторная работа</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 id="title">Лабораторная работа</h1>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <section class="controls">
      <button id="reset">Сбросить</button>
      <button id="rotateLeft">Повернуть −</button>
      <button id="rotateRight">Повернуть +</button>
      <button id="rotateUp">Повернуть вверх</button>
      <button id="rotateDown">Повернуть вниз</button>
      <button id="rotateZLeft">Повернуть Z −</button>
      <button id="rotateZRight">Повернуть Z +</button>
      <button id="scaleDown">Масштаб −</button>
      <button id="scaleUp">Масштаб +</button>
      <button id="moveLeft">←</button><button id="moveRight">→</button>
      <button id="moveUp">↑</button><button id="moveDown">↓</button>
      <button id="moveZBack">Z−</button><button id="moveZForward">Z+</button>
    </section>
  </main>
  <script type="module" src="index.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная работа №7 — анимация</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <div id="viewport" class="viewport"></div>

    <aside class="panel">
      <header class="panel-head">
        <h1>Лабораторная работа №7</h1>
        <p class="subtitle">Анимация: скелет из частей и цикл движения</p>
      </header>

      <section class="group">
        <h2>Режим</h2>

        <div class="segment" id="modeSwitch">
          <button type="button" data-mode="idle" class="active">Покой</button>
          <button type="button" data-mode="walk">Ходьба</button>
          <button type="button" data-mode="run">Бег</button>
        </div>
      </section>

      <section class="group">
        <h2>Параметры</h2>

        <label class="row">
          <span>Скорость</span>
          <input id="speed" type="range" min="0.3" max="2" step="0.05" value="1" />
          <output data-for="speed">1</output>
        </label>
      </section>

      <section class="group">
        <h2>Отображение</h2>

        <label class="toggle">
          <input id="showPivots" type="checkbox" />
          Показать шарниры
        </label>
      </section>

      <footer class="panel-foot">
        <button id="reset" type="button">Сбросить</button>
        <p class="hint">ЛКМ — вращение · колесо — масштаб · ПКМ — сдвиг</p>
      </footer>
    </aside>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>

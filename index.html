<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная работа №6 — текстуры</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <div id="viewport" class="viewport"></div>

    <aside class="panel">
      <header class="panel-head">
        <h1>Лабораторная работа №6</h1>
        <p class="subtitle">Текстуры: UV-развёртка, фильтрация, анизотропия</p>
      </header>

      <section class="group">
        <h2>Текстура</h2>

        <div class="segment" id="textureSwitch">
          <button type="button" data-texture="checker" class="active">Чекер</button>
          <button type="button" data-texture="brick">Кирпич</button>
          <button type="button" data-texture="tiles">Плитка</button>
          <button type="button" data-texture="noise">Шум</button>
        </div>

        <label class="file">
          <input id="textureFile" type="file" accept="image/*" />
          <span>Загрузить свою картинку</span>
        </label>
      </section>

      <section class="group">
        <h2>Параметры</h2>

        <label class="row">
          <span>Повтор UV</span>
          <input id="repeat" type="range" min="0.05" max="0.6" step="0.01" value="0.16" />
          <output data-for="repeat">0.16</output>
        </label>

        <label class="row">
          <span>Анизотропия</span>
          <input id="anisotropy" type="range" min="1" max="8" step="1" value="8" />
          <output data-for="anisotropy">8</output>
        </label>

        <label class="row">
          <span>Шероховатость</span>
          <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.55" />
          <output data-for="roughness">0.55</output>
        </label>
      </section>

      <section class="group">
        <h2>Отображение</h2>

        <label class="toggle">
          <input id="nearest" type="checkbox" />
          Точечная фильтрация
        </label>

        <label class="toggle">
          <input id="autoRotate" type="checkbox" />
          Вращение
        </label>
      </section>

      <footer class="panel-foot">
        <button id="reset" type="button">Сбросить</button>
        <p class="hint">ЛКМ — вращение · колесо — масштаб · ПКМ — сдвиг</p>
      </footer>
    </aside>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
